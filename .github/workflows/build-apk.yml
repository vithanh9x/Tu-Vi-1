name: Build Tu Vi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and launcher icon resources
        shell: bash
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-${density}/ic_launcher.png"
            test -s "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -s app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tu-Vi-1-APK-v1.2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
